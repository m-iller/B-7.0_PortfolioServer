services:
  web:
    build: .
    image: portfolio-app:1.0.0
    container_name: portfolio_backend
    command: ["web"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:///app/data/portfolio.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    # Same image as web. Do not set build: here — Compose would unpack
    # the image twice and fill a small disk. Rebuild with:
    #   docker compose build web && docker compose up -d
    image: portfolio-app:1.0.0
    container_name: portfolio_bot
    command: ["bot"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
